name: CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Ensure pytest is installed even if not in requirements.txt
          pip install pytest pytest-asyncio

      - name: Execute Tests
        env:
          # Inject mock environment variables required by your tests
          ENVIRONMENT: testing
        run: |
          pytest tests/ -v
